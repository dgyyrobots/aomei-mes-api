server:
  port: 48080

  # 基于netty的服务器
  broker:
    enabled: false           # mqttBroker类型选择, true: 基于netty的mqttBroker和webSocket  false: emq的mqttBroker
    broker-node: node1       # 服务器集群节点
    port: 1883
    openws: false             # 控制webSocket是否开启
    websocket-port: 8083
    websocket-path: /mqtt
    keep-alive: 70          # 默认的全部客户端心跳上传时间

--- #################### 数据库相关配置 ####################

spring:
  # 数据源配置项
  autoconfigure:
    exclude:
      - com.alibaba.druid.spring.boot.autoconfigure.DruidDataSourceAutoConfigure # 排除 Druid 的自动配置，使用 dynamic-datasource-spring-boot-starter 配置多数据源
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration # 排除积木报表带来的 MongoDB 的自动配置
  datasource:
    druid: # Druid 【监控】相关的全局配置
      initial-size: 5
      min-idle: 10
      max-active: 20
      max-wait: 60000
      test-while-idle: true
      test-on-borrow: true       # 获取连接时校验
      test-on-return: false
      validation-query: SELECT 1  # 显式声明验证SQL
      keepalive: true            # 开启保活机制
      keep-alive-between-time-millis: 30000 # 30秒发送一次心跳
      time-between-connect-error-millis: 60000 # 连接错误重试间隔
      time-between-eviction-runs-millis: 15000   # 改为15秒一次检测
      phy-timeout-millis: 600000 # 物理连接超时时间(10分钟)
      min-evictable-idle-time-millis: 180000 # 最小空闲时间(3分钟)
      max-evictable-idle-time-millis: 300000    # 最大空闲时间(5分钟)
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: true
        allow: # 设置白名单，不填则允许所有访问
        url-pattern: /druid/*
        login-username: # 控制台管理用户名和密码
        login-password:
      filter:
        stat:
          enabled: true
          log-slow-sql: true # 慢 SQL 记录
          slow-sql-millis: 100
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000;druid.connect.keepAlive=true;druid.connect.timeout=3000;druid.socket.timeout=120000
    dynamic: # 多数据源配置
      druid: # Druid 【连接池】相关的全局配置
        initial-size: 5 # 初始连接数
        min-idle: 10 # 最小连接池数量
        max-active: 20 # 最大连接池数量
        max-wait: 60000  # 配置获取连接等待超时的时间，单位：毫秒
        time-between-eviction-runs-millis: 30000  # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位：毫秒
        min-evictable-idle-time-millis: 300000  # 配置一个连接在池中最小生存的时间，单位：毫秒
        max-evictable-idle-time-millis: 600000  # 配置一个连接在池中最大生存的时间，单位：毫秒
        test-while-idle: true
        test-on-borrow: true  # 改为true，在借用时检测，确保连接有效
        test-on-return: false
        keep-alive: true # 启用保持连接活跃
        remove-abandoned: true # 启用移除废弃连接
        remove-abandoned-timeout: 120 # 设置废弃连接超时时间(秒)
        log-abandoned: true # 记录废弃连接日志
